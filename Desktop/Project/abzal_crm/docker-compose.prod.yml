services:
  postgres:
    image: postgres:16-alpine
    container_name: abzal_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abzal_crm}
      POSTGRES_USER: ${POSTGRES_USER:-abzal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abzal} -d ${POSTGRES_DB:-abzal_crm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: abzal_crm_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    volumes:
      - ./server/templates:/app/server/templates
    expose:
      - "4000"

  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: abzal_crm_nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:

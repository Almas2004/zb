services:
  postgres:
    image: postgres:16-alpine
    container_name: abzal_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: abzal_crm
      POSTGRES_USER: abzal
      POSTGRES_PASSWORD: abzal_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abzal -d abzal_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrofest
      POSTGRES_PASSWORD: agrofest
      POSTGRES_DB: agrofest
    volumes:
      - agrofest_pg:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrofest -d agrofest"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agrofest:agrofest@db:5432/agrofest?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      ALLOW_OUTSIDE_EVENT_DATES: ${ALLOW_OUTSIDE_EVENT_DATES:-false}
      TEST_EVENT_DATE: ${TEST_EVENT_DATE:-2026-07-31}
    ports:
      - "${APP_PORT:-3001}:3000"
    command: >
      sh -c "node -e \"const net=require('net');let n=0;function wait(){const s=net.connect(5432,'db');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>{if(++n>60)process.exit(1);setTimeout(wait,1000)})}wait()\" &&
      npx prisma migrate deploy &&
      npm run start"

volumes:
  agrofest_pg:

name: Deploy Abzal CRM to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/Project/abzal_crm/**'
      - '.github/workflows/deploy-abzal-crm.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop/Project/abzal_crm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Desktop/Project/abzal_crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build -w client

      - name: Validate server files
        run: |
          node --check server/src/index.js
          node --check server/src/routes/telegram.js
          node --check server/src/documentsService.js

      - name: Write env files and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          ROOT_ENV_FILE: ${{ secrets.DEPLOY_ROOT_ENV }}
          SERVER_ENV_FILE: ${{ secrets.DEPLOY_SERVER_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: ROOT_ENV_FILE,SERVER_ENV_FILE
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            PROJECT_DIR="${APP_DIR}/Desktop/Project/abzal_crm"
            DEPLOY_USER="${{ secrets.VPS_USERNAME }}"

            sudo mkdir -p "${APP_DIR}"
            sudo chown -R "${DEPLOY_USER}:${DEPLOY_USER}" "${APP_DIR}"
            if [ ! -d "${APP_DIR}/.git" ]; then
              git clone "${REPO_URL}" "${APP_DIR}"
            fi

            cd "${APP_DIR}"
            git fetch origin main
            git reset --hard "${{ github.sha }}"

            mkdir -p "${PROJECT_DIR}/server/templates"

            cat > "${PROJECT_DIR}/.env" <<EOF
            ${ROOT_ENV_FILE}
            EOF
            cat > "${PROJECT_DIR}/server/.env" <<EOF
            ${SERVER_ENV_FILE}
            EOF

            cd "${PROJECT_DIR}"
            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T server node src/scripts/initDb.js
            docker image prune -f
